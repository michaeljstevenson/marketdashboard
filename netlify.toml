[functions."scheduled-breadth-background"]
  # 20:30 UTC = 4:30pm EDT (summer). Shifts to 3:30pm during EST (winter,
  # roughly Nov-Mar) since Netlify's cron runs in UTC with no DST
  # awareness — adjust to 21:30 for winter-accurate timing if that hour
  # drift matters, though either is safely after the 4:00pm ET close.
  schedule = "30 20 * * 1-5"

[functions."scheduled-sectors-background"]
  # Staggered 5 minutes after scheduled-breadth-background (20:35 vs
  # 20:30 UTC) so the two heavy sequential-fetch jobs don't run
  # concurrently and compete for Alpha Vantage's rate limit.
  schedule = "35 20 * * 1-5"

[functions."scheduled-ath-tradingview"]
  # Staggered after the Alpha-Vantage-based jobs above (20:40 UTC) even
  # though this one hits a completely different data source (TradingView,
  # not Alpha Vantage) and only takes a single request — no real
  # contention risk, just keeping all the daily jobs in one predictable
  # block after the close.
  schedule = "40 20 * * 1-5"

[functions."scheduled-ticker-background"]
  # Every 2 minutes during US market hours on weekdays (13:30-20:00 UTC =
  # 9:30am-4:00pm EDT summer; drifts an hour during EST winter, same
  # DST caveat as the jobs above). Unlike those once-daily jobs, the
  # ticker tape is meant to feel current through the trading day. Each
  # run actually takes ~2.3 minutes (paced to stay under Alpha Vantage's
  # per-minute rate cap across ~156 calls — see scheduled-ticker-
  # background.js), so back-to-back 2-minute ticks would overlap; the
  # function's own lock (also in that file) makes an overlapping trigger
  # a no-op rather than double-firing calls and re-tripping the rate
  # limit, so the real-world cadence ends up ~2.3 minutes, back-to-back.
  schedule = "*/2 13-20 * * 1-5"

[functions."scheduled-factors-background"]
  # Weekly (Saturday 09:00 UTC), not daily like the jobs above — Ken
  # French updates the underlying data roughly monthly, so daily runs
  # would just re-download and re-parse ~180k unchanged data points 6
  # days out of 7 for nothing.
  schedule = "0 9 * * 6"

[functions."scheduled-countries-background"]
  # Staggered after the other Alpha-Vantage-based daily jobs (20:45 UTC,
  # 5 minutes after scheduled-ath-tradingview) so this one's 11 sequential
  # full-history fetches don't compete with theirs for the rate limit.
  schedule = "45 20 * * 1-5"

[functions."scheduled-seasonality-background"]
  # 20:50 UTC — after the other daily jobs. Not an Alpha Vantage call
  # (Yahoo, not AV), so there's no real rate-limit contention with them;
  # staggered anyway just to keep all the once-daily jobs in one block.
  schedule = "50 20 * * 1-5"

[functions."scheduled-daychange-background"]
  # Hourly at :30 past, 13:30-19:30 UTC (9:30am-3:30pm EDT summer; drifts
  # an hour during EST winter, same DST caveat as the jobs above) —
  # covers the trading session without needing a call right at the open
  # (no prior-close-vs-now gap to measure yet) or close (the once-daily
  # scheduled-breadth-background job already captures that snapshot).
  # Deliberately separate from that job: this one only needs GLOBAL_QUOTE
  # (current price vs. previous close) per symbol, not full history, so
  # it's cheap enough to run through the day — see
  # scheduled-daychange-background.js for the rate-limit pacing.
  schedule = "30 13-19 * * 1-5"

[functions."scheduled-putcall-background"]
  # 20:55 UTC — after the other daily jobs. Moved off the live request
  # path (was inside data.js, refetched on every page load) after its
  # ~40 sequential per-date Alpha Vantage calls started pushing that
  # function's runtime past Netlify's timeout; see
  # scheduled-putcall-background.js for the full story.
  schedule = "55 20 * * 1-5"

[functions."scheduled-sentiment-background"]
  # 21:00 UTC — after scheduled-breadth-background (needs its blob) and
  # scheduled-putcall-background (needs its blob) have both finished.
  # Computes the whole U.S. Market Sentiment Index once daily and writes
  # it to Netlify Blobs; data.js just reads that blob now instead of
  # recomputing everything live on every page load — see
  # scheduled-sentiment-background.js for the full story.
  schedule = "0 21 * * 1-5"

[functions."scheduled-oddstats-background"]
  # 21:10 UTC — last of the daily block. Yahoo-only (no Alpha Vantage
  # contention); runs the full streak scanner (~24 sequential Yahoo
  # fetches + ~360 analog scans) and writes the board to Netlify Blobs
  # for oddstats.js to serve. Background function for the long runtime —
  # see scheduled-oddstats-background.js.
  schedule = "10 21 * * 1-5"

[functions."scheduled-beeswarm-daily-background"]
  # 21:40 UTC — after the whole daily Alpha-Vantage block above has
  # cleared (last of it, scheduled-oddstats, is Yahoo but the AV jobs
  # finish well before 21:40), so this job's ~504 GLOBAL_QUOTE calls
  # don't compete for the rate limit. 21:40 UTC = 5:40pm EDT / 4:40pm EST
  # — always after the 4:00pm ET close plus the 15-minute quote delay,
  # in either DST regime. Captures the end-of-day sector-beeswarm
  # snapshot; see scheduled-beeswarm-daily-background.js.
  schedule = "40 21 * * 1-5"

[functions."scheduled-beeswarm-meta-background"]
  # Weekly, Saturday 07:00 UTC — before scheduled-factors-background
  # (09:00 Sat) and well clear of the weekday jobs. ~503 COMPANY_OVERVIEW
  # calls for per-company sector / shares-outstanding metadata that the
  # daily beeswarm job joins against; changes little week to week.
  schedule = "0 7 * * 6"

[functions."scheduled-beeswarm-annual-background"]
  # Weekly, Saturday 08:30 UTC — after the meta job, before the factors
  # job. Only ~12 TIME_SERIES_MONTHLY_ADJUSTED calls (sector ETFs + SPY)
  # to recompute calendar-year returns for the annual historical view;
  # the data only really moves once a year at each year-end close.
  schedule = "30 8 * * 6"

[functions."scheduled-concentration-background"]
  # Weekly, Saturday 09:30 UTC — after the factors job. Only ~8 Alpha
  # Vantage (monthly bars) + ~7 SEC calls for the Magnificent Seven
  # cap-weighted basket vs S&P 500; monthly-granularity data that barely
  # moves week to week, and the SEC share counts update only quarterly.
  schedule = "30 9 * * 6"

[functions."scheduled-concentration-history-background"]
  # Weekly, Saturday 10:00 UTC — after scheduled-concentration-background.
  # ~39 Alpha Vantage monthly-bar calls (SPY + the ever-largest names) for
  # the top-10-share history and annual return-contribution charts;
  # quarterly/annual data that only moves at each quarter-end.
  schedule = "0 10 * * 6"

[functions."scheduled-revisions-background"]
  # Weekly, Saturday 07:20 UTC — 20 minutes after
  # scheduled-beeswarm-meta-background (07:00 UTC), which this job depends
  # on for per-ticker sector/name (see scheduled-revisions-background.js
  # for why it reads that job's blob instead of its own OVERVIEW calls).
  # ~503 sequential EARNINGS_ESTIMATES calls, same ~1.05s pacing as the
  # meta job; trailing-30-day revision counts and 30-day drift don't need
  # daily refresh, so weekly (not one of the weekday daily-close jobs)
  # matches how this site treats other full-index sweeps.
  schedule = "20 7 * * 6"

[functions."scheduled-smallcap-background"]
  # 21:15 UTC — in the gap between scheduled-oddstats (21:10) and
  # scheduled-beeswarm-daily (21:40) in the once-daily post-close block.
  # Only 5 Alpha Vantage calls total (3 full-history TIME_SERIES_DAILY_
  # ADJUSTED + FEDERAL_FUNDS_RATE + TREASURY_YIELD, both monthly), so
  # unlike the full-S&P-500-sweep jobs in this block there's no real
  # rate-limit contention risk either way — staggered anyway to keep the
  # daily block's logs easy to read in order. Daily, not weekly, since
  # (unlike a sparse-event dataset) index levels move every trading day.
  schedule = "15 21 * * 1-5"

[functions."scheduled-international-background"]
  # 21:20 UTC — right after scheduled-smallcap-background (21:15), the same
  # kind of small fixed-basket job (4 Alpha Vantage calls here vs. that
  # job's 5) with no real rate-limit contention risk. Daily, not weekly,
  # since index levels move every trading day.
  schedule = "20 21 * * 1-5"

[functions."scheduled-share-count-background"]
  # Weekly, Saturday 10:50 UTC — after scheduled-insider-transactions-
  # background (10:30 UTC, ~9 minutes for its own ~503-call sweep at the
  # same 1050ms pacing), so this job's own ~503 sequential BALANCE_SHEET
  # calls don't compete with it for the rate limit. Weekly, not daily:
  # share counts only change when a company files a new 10-Q/10-K.
  schedule = "50 10 * * 6"

[functions."scheduled-dispersion-background"]
  # Weekly, Saturday 11:10 UTC — after scheduled-share-count-background
  # (10:50 UTC, ~9-10 minutes for its own ~503-call sweep at the same
  # 1050ms pacing), so this job's own ~503 sequential Alpha Vantage
  # EARNINGS_ESTIMATES calls don't compete with it for the rate limit.
  # Weekly, not daily: a current-fiscal-year analyst estimate's high/low
  # spread barely moves day to day.
  schedule = "10 11 * * 6"

[functions."scheduled-shareholder-yield-background"]
  # Weekly, Saturday 11:25 UTC — after scheduled-share-count-background
  # (10:50 UTC, finishes ~11:00; this job reads its trends.json for buyback
  # yield) and after scheduled-dispersion-background's own ~503-call sweep
  # (starts 11:10, finishes ~11:19), so this job's own ~503 sequential
  # COMPANY_OVERVIEW calls don't compete with either for the rate limit.
  schedule = "25 11 * * 6"

[functions."scheduled-insider-transactions-background"]
  # Weekly, Saturday 10:30 UTC — after the rest of the Saturday block
  # (beeswarm-meta at 07:00, whose meta.json this job reads for company
  # name/sector; concentration-history at 10:00). ~503 sequential Alpha
  # Vantage INSIDER_TRANSACTIONS calls at 1050ms spacing plus a retry
  # pass — the same pacing proven safe at this exact universe size by
  # scheduled-beeswarm-meta-background.js's OVERVIEW sweep. Weekly
  # because a single company's Form 4 filings are sparse enough that a
  # trailing-90-day aggregate barely moves day to day.
  schedule = "30 10 * * 6"

[functions."scheduled-surprise-background"]
  # Weekly, Saturday 11:10 UTC — 40 minutes after
  # scheduled-insider-transactions-background (10:30 Sat) starts, giving its
  # own ~503-call sweep (plus retry pass) room to finish before this one
  # begins. Reads beeswarm-meta's meta.json for sector/name, same reuse
  # pattern as the revisions and insider-transactions jobs. ~503 sequential
  # Alpha Vantage EARNINGS calls at 1050ms spacing plus a retry pass.
  # Weekly, not daily: this rebuilds the whole quarterly panel fresh each
  # run (see scheduled-surprise-background.js for why no accumulating
  # snapshot is needed here), and which companies have newly reported only
  # changes meaningfully week to week, not day to day.
  schedule = "10 11 * * 6"

[functions."scheduled-dividend-growth-background"]
  # Weekly, Saturday 12:00 UTC — after scheduled-surprise-background
  # (11:10 Sat), leaving that job's own ~503-call sweep (plus retry pass)
  # room to finish first. Reads beeswarm-meta's meta.json for sector/name,
  # same reuse pattern as the other full-sweep jobs. ~503 sequential Alpha
  # Vantage DIVIDENDS calls at 1050ms spacing plus a retry pass — each call
  # returns a company's whole dividend history, so unlike the daily-close
  # jobs there's no reason to run this more than weekly; a new dividend
  # increase only lands a few times a year per company at most.
  schedule = "0 12 * * 6"
