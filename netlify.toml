[functions."scheduled-breadth-background"]
  # 21:30 UTC = 5:30pm EDT (summer) / 4:30pm EST (winter). Netlify's cron
  # runs in UTC with no DST awareness, so 21:30 keeps the whole daily
  # block after the 4:00pm ET close in either regime.
  schedule = "30 21 * * 1-5"

[functions."scheduled-sectors-background"]
  # 5 minutes after scheduled-breadth-background (21:35 vs 21:30 UTC).
  # Yahoo Finance, not Alpha Vantage, so no rate-limit contention with it.
  schedule = "35 21 * * 1-5"

[functions."scheduled-ath-tradingview"]
  # Staggered after the Alpha-Vantage-based jobs above (21:40 UTC) even
  # though this one hits a completely different data source (TradingView,
  # not Alpha Vantage) and only takes a single request — no real
  # contention risk, just keeping all the daily jobs in one predictable
  # block after the close.
  schedule = "40 21 * * 1-5"

[functions."scheduled-ticker-background"]
  # Every 2 minutes during US market hours on weekdays (13:30-20:00 UTC =
  # 9:30am-4:00pm EDT summer; drifts an hour during EST winter, same
  # DST caveat as the jobs above). Unlike those once-daily jobs, the
  # ticker tape is meant to feel current through the trading day. Quotes
  # now come from Yahoo's batched spark endpoint (a run takes seconds);
  # only Fed Funds and WTI still use Alpha Vantage, at most every 30
  # minutes (see scheduled-ticker-background.js). The function's own lock
  # makes an overlapping trigger a no-op.
  schedule = "*/2 13-20 * * 1-5"

[functions."scheduled-factors-background"]
  # Weekly (Saturday 09:00 UTC), not daily like the jobs above — Ken
  # French updates the underlying data roughly monthly, so daily runs
  # would just re-download and re-parse ~180k unchanged data points 6
  # days out of 7 for nothing.
  schedule = "0 9 * * 6"

[functions."scheduled-countries-background"]
  # 21:45 UTC, 5 minutes after scheduled-ath-tradingview. Yahoo Finance,
  # not Alpha Vantage, so no rate-limit contention with the AV-based jobs.
  schedule = "45 21 * * 1-5"

[functions."scheduled-drawdown-background"]
  # 21:30 UTC = 5:30pm EDT / 4:30pm EST, after the close in either regime.
  # Yahoo, not Alpha Vantage, so no rate-limit contention with the block.
  schedule = "30 21 * * 1-5"

[functions."scheduled-seasonality-background"]
  # 21:50 UTC — after the other daily jobs. Not an Alpha Vantage call
  # (Yahoo, not AV), so there's no real rate-limit contention with them;
  # staggered anyway just to keep all the once-daily jobs in one block.
  schedule = "50 21 * * 1-5"

[functions."scheduled-daychange-background"]
  # Hourly at :30 past, 13:30-19:30 UTC (9:30am-3:30pm EDT summer; drifts
  # an hour during EST winter, same DST caveat as the jobs above) —
  # covers the trading session without needing a call right at the open
  # (no prior-close-vs-now gap to measure yet) or close (the once-daily
  # scheduled-breadth-background job already captures that snapshot).
  # Deliberately separate from that job: this one only needs the current
  # price vs. previous close per symbol, fetched from Yahoo's batched
  # spark endpoint (no Alpha Vantage calls), so it's cheap enough to run
  # through the day.
  schedule = "30 13-19 * * 1-5"

[functions."scheduled-putcall-background"]
  # 21:55 UTC — after the other daily jobs. Moved off the live request
  # path (was inside data.js, refetched on every page load) after its
  # ~40 sequential per-date Alpha Vantage calls started pushing that
  # function's runtime past Netlify's timeout; see
  # scheduled-putcall-background.js for the full story.
  schedule = "55 21 * * 1-5"

[functions."scheduled-sentiment-background"]
  # 22:00 UTC — after scheduled-breadth-background (needs its blob) and
  # scheduled-putcall-background (needs its blob) have both finished.
  # Computes the whole U.S. Market Sentiment Index once daily and writes
  # it to Netlify Blobs; data.js just reads that blob now instead of
  # recomputing everything live on every page load — see
  # scheduled-sentiment-background.js for the full story.
  schedule = "0 22 * * 1-5"

[functions."scheduled-oddstats-background"]
  # 22:10 UTC — last of the daily block. Yahoo-only (no Alpha Vantage
  # contention); runs the full streak scanner (~24 sequential Yahoo
  # fetches + ~360 analog scans) and writes the board to Netlify Blobs
  # for oddstats.js to serve. Background function for the long runtime —
  # see scheduled-oddstats-background.js.
  schedule = "10 22 * * 1-5"

[functions."scheduled-beeswarm-daily-background"]
  # 22:40 UTC — after the whole daily Alpha-Vantage block above has
  # cleared (last of it, scheduled-oddstats, is Yahoo but the AV jobs
  # finish well before 21:40), so this job's ~504 GLOBAL_QUOTE calls
  # don't compete for the rate limit. 22:40 UTC = 6:40pm EDT / 5:40pm EST
  # — always after the 4:00pm ET close plus the 15-minute quote delay,
  # in either DST regime. Captures the end-of-day sector-beeswarm
  # snapshot; see scheduled-beeswarm-daily-background.js.
  schedule = "40 22 * * 1-5"

[functions."scheduled-beeswarm-meta-background"]
  # Weekly, Saturday 07:00 UTC — before scheduled-factors-background
  # (09:00 Sat) and well clear of the weekday jobs. ~503 COMPANY_OVERVIEW
  # calls for per-company sector / shares-outstanding metadata that the
  # daily beeswarm job joins against; changes little week to week.
  schedule = "0 7 * * 6"

[functions."scheduled-beeswarm-annual-background"]
  # Weekly, Saturday 08:30 UTC — after the meta job, before the factors
  # job. Only ~12 TIME_SERIES_MONTHLY_ADJUSTED calls (sector ETFs + SPY)
  # to recompute calendar-year returns for the annual historical view;
  # the data only really moves once a year at each year-end close.
  schedule = "30 8 * * 6"

[functions."scheduled-concentration-background"]
  # Weekly, Saturday 09:30 UTC — after the factors job. Only ~8 Alpha
  # Vantage (monthly bars) + ~7 SEC calls for the Magnificent Seven
  # cap-weighted basket vs S&P 500; monthly-granularity data that barely
  # moves week to week, and the SEC share counts update only quarterly.
  schedule = "30 9 * * 6"

[functions."scheduled-concentration-history-background"]
  # Weekly, Saturday 10:00 UTC — after scheduled-concentration-background.
  # ~39 Alpha Vantage monthly-bar calls (SPY + the ever-largest names) for
  # the top-10-share history and annual return-contribution charts;
  # quarterly/annual data that only moves at each quarter-end.
  schedule = "0 10 * * 6"

[functions."scheduled-revisions-background"]
  # Weekly, Saturday 07:20 UTC — 20 minutes after
  # scheduled-beeswarm-meta-background (07:00 UTC), which this job depends
  # on for per-ticker sector/name (see scheduled-revisions-background.js
  # for why it reads that job's blob instead of its own OVERVIEW calls).
  # ~503 sequential EARNINGS_ESTIMATES calls, same ~1.05s pacing as the
  # meta job; trailing-30-day revision counts and 30-day drift don't need
  # daily refresh, so weekly (not one of the weekday daily-close jobs)
  # matches how this site treats other full-index sweeps.
  schedule = "20 7 * * 6"

[functions."scheduled-smallcap-background"]
  # 21:15 UTC — in the gap between scheduled-oddstats (21:10) and
  # scheduled-beeswarm-daily (21:40) in the once-daily post-close block.
  # Only 5 Alpha Vantage calls total (3 full-history TIME_SERIES_DAILY_
  # ADJUSTED + FEDERAL_FUNDS_RATE + TREASURY_YIELD, both monthly), so
  # unlike the full-S&P-500-sweep jobs in this block there's no real
  # rate-limit contention risk either way — staggered anyway to keep the
  # daily block's logs easy to read in order. Daily, not weekly, since
  # (unlike a sparse-event dataset) index levels move every trading day.
  schedule = "15 22 * * 1-5"

[functions."scheduled-international-background"]
  # Daily 22:20 UTC, right after scheduled-smallcap-background (22:15). Index
  # levels move every trading day; a handful of Yahoo calls, no contention
  # risk.
  schedule = "20 22 * * *"

[functions."scheduled-share-count-background"]
  # Weekly, Saturday 10:50 UTC — after scheduled-insider-transactions-
  # background (10:30 UTC, ~9 minutes for its own ~503-call sweep at the
  # same 1050ms pacing), so this job's own ~503 sequential BALANCE_SHEET
  # calls don't compete with it for the rate limit. Weekly, not daily:
  # share counts only change when a company files a new 10-Q/10-K.
  schedule = "50 10 * * 6"

[functions."scheduled-dispersion-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-surprise-background above. Kept for reference, the original
  # staggering rationale: Weekly, Saturday 11:40 UTC — originally 11:10,
  # but that collided
  # exactly with scheduled-surprise-background (also Saturday 11:10 UTC,
  # a separate PR's ~503-call EARNINGS sweep, built concurrently and
  # unaware of this one). Moved to 11:40 instead: after
  # scheduled-shareholder-yield-background's own ~503-call COMPANY_OVERVIEW
  # sweep (starts 11:25, finishes ~11:34) and with a comfortable buffer
  # before scheduled-dividend-growth-background at 12:00, so none of these
  # three full-index sweeps compete for the rate limit. Weekly, not daily:
  # a current-fiscal-year analyst estimate's high/low spread barely moves
  # day to day.

[functions."scheduled-shareholder-yield-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-surprise-background above. Kept for reference, the original
  # staggering rationale: Weekly, Saturday 11:25 UTC — after
  # scheduled-share-count-background
  # (10:50 UTC, finishes ~11:00; this job reads its trends.json for buyback
  # yield) and after scheduled-surprise-background's own ~503-call sweep
  # (starts 11:10, finishes ~11:19), so this job's own ~503 sequential
  # COMPANY_OVERVIEW calls don't compete with either for the rate limit.
  # (scheduled-dispersion-background used to run in this same 11:10 window
  # too — see that function's own schedule comment — but was moved to
  # 11:40, after this job's sweep finishes, to resolve a same-minute
  # collision with scheduled-surprise-background.)

[functions."scheduled-splits-background"]
  # Weekly, Saturday 12:20 UTC, after dividend-growth (12:00). Splits are rare
  # discrete events; the price pull only runs for tickers with a split in the
  # last 5 years.
  schedule = "20 12 * * 6"

[functions."scheduled-pe-divergence-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-surprise-background above. Kept for reference, the original
  # staggering rationale: Weekly, Saturday 12:45 UTC — originally 11:40,
  # but that collided
  # exactly with scheduled-dispersion-background (also moved to 11:40 —
  # see that function's own schedule comment for the unrelated collision
  # it was resolving). Moved to 12:45 instead: after
  # scheduled-splits-background's two-stage sweep (starts 12:20, finishes
  # ~12:30-12:35 depending on how many tickers need stage 2), leaving
  # room for this job's own ~503 sequential OVERVIEW calls to run without
  # competing for the rate limit. Snapshot-only endpoint (no history), so
  # the market-wide median is appended to a running weekly time series
  # each run rather than overwritten — see
  # scheduled-pe-divergence-background.js.

[functions."scheduled-insider-transactions-background"]
  # Weekly, Saturday 10:30 UTC — after the rest of the Saturday block
  # (beeswarm-meta at 07:00, whose meta.json this job reads for company
  # name/sector; concentration-history at 10:00). ~503 sequential Alpha
  # Vantage INSIDER_TRANSACTIONS calls at 1050ms spacing plus a retry
  # pass — the same pacing proven safe at this exact universe size by
  # scheduled-beeswarm-meta-background.js's OVERVIEW sweep. Weekly
  # because a single company's Form 4 filings are sparse enough that a
  # trailing-90-day aggregate barely moves day to day.
  schedule = "30 10 * * 6"

[functions."scheduled-surprise-background"]
  # One-time snapshot (2026-09-16) — no schedule. Earnings Surprise History
  # is meant to read as "the research as it stood on this date," not a
  # continuously-refreshed page, so the recurring schedule below was
  # removed after the initial data pull. Run manually (Netlify dashboard
  # "Run now") if a fresh snapshot is ever wanted later. Kept for
  # reference, the original staggering rationale: Weekly, Saturday 11:10
  # UTC — 40 minutes after
  # scheduled-insider-transactions-background (10:30 Sat) starts, giving its
  # own ~503-call sweep (plus retry pass) room to finish before this one
  # begins. Reads beeswarm-meta's meta.json for sector/name, same reuse
  # pattern as the revisions and insider-transactions jobs. ~503 sequential
  # Alpha Vantage EARNINGS calls at 1050ms spacing plus a retry pass.
  # Weekly, not daily: this rebuilds the whole quarterly panel fresh each
  # run (see scheduled-surprise-background.js for why no accumulating
  # snapshot is needed here), and which companies have newly reported only
  # changes meaningfully week to week, not day to day.

[functions."scheduled-dividend-growth-background"]
  # Weekly, Saturday 12:00 UTC, after post-earnings-drift (11:30). One Yahoo
  # call returns a company's whole dividend history, and increases land only a
  # few times a year, so weekly is plenty.
  schedule = "0 12 * * 6"

[functions."scheduled-relative-strength-background"]
  # Weekly, Saturday 13:10 UTC. A 1-month/3-month momentum read doesn't change
  # day to day, and the persistence test needs snapshots spaced apart.
  schedule = "10 13 * * 6"

[functions."scheduled-equity-risk-premium-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-surprise-background above. Kept for reference, the original
  # staggering rationale: Weekly, Saturday 13:35 UTC — originally 12:30
  # (30 minutes after this
  # PR's own scheduled-relative-strength-background, which it assumed was
  # still at 12:00 and the last job in the Saturday block), but that landed
  # in the middle of scheduled-splits-background's 12:20-~12:31 window (a
  # separate, concurrently-built PR's two-stage sweep, unaware of this one
  # — see that function's own schedule comment) once both were merged.
  # Moved to 13:35 instead: after scheduled-relative-strength-background
  # itself (13:10 UTC, finishes ~13:19, once *its own* collision was fixed
  # — see that function's schedule comment), the last job in the Saturday
  # block as of this fix, leaving headroom even if that job's own retry
  # pass runs long. ~504 sequential Alpha Vantage COMPANY_OVERVIEW/
  # TREASURY_YIELD calls at 1050ms spacing plus a retry pass. Weekly, not
  # daily: a trailing P/E-derived earnings yield doesn't meaningfully move
  # day to day.

[functions."scheduled-earnings-growth-divergence-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-surprise-background above. Kept for reference, the original
  # staggering rationale: Weekly, Saturday 14:00 UTC — originally 13:00
  # (after this PR's own
  # scheduled-relative-strength-background at 12:00 and scheduled-equity-
  # risk-premium-background at 12:30, both since moved — see those
  # functions' own schedule comments for the unrelated collisions that
  # forced the moves). Real dependency, not just pacing: this job reads
  # scheduled-relative-strength-background's own latest.json for 3-month
  # price performance instead of running a second price sweep, so it needs
  # that job to have already completed this same Saturday morning for
  # fresh data (falls back to EPS-growth-only rows, not a crash, if it
  # hasn't) — now scheduled at 13:10, finishing ~13:19. Moved to 14:00 to
  # stay safely after that and after scheduled-equity-risk-premium-
  # background (13:35 UTC, finishes ~13:44), the last two jobs in the
  # Saturday block as of this fix. ~503 sequential Alpha Vantage EARNINGS
  # calls at 1050ms spacing plus a retry pass.

[functions."scheduled-smallcap-liquidity-background"]
  # Weekly, Saturday 14:20 UTC. Reads meta.json (itself refreshed weekly) for
  # cohort membership and recomputes the full ~2-year window each run, so a
  # daily rerun would redo the same sweep for a cohort that barely changes.
  schedule = "20 14 * * 6"

[functions."scheduled-ipo-pipeline-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-surprise-background above. Kept for reference, the original
  # staggering rationale: Weekly, Saturday 13:20 UTC. Sits in the gap
  # between scheduled-share-
  # count-background (10:50 UTC, done well before 13:00) and scheduled-
  # smallcap-liquidity-background (13:35 UTC, that job's own comment notes
  # every job in this file is done by ~11:00-13:15 UTC) — 13:20 leaves 15
  # minutes of clearance on both sides. Trivial call volume: 1 IPO_CALENDAR
  # pull, plus up to ~15 TIME_SERIES_DAILY_ADJUSTED (outputsize=compact)
  # calls for roster entries whose IPO date has passed or is still being
  # tracked, plus one shared SPY compact pull reused across all of them —
  # nothing close to the pacing concerns of this file's full-S&P-500-sweep
  # jobs. Weekly, not daily: IPO_CALENDAR's forward window barely moves
  # day to day, and the aftermarket-tracking roster only needs to check
  # each newly-listed name's day-1/5/10/20 returns once those trading days
  # have actually elapsed, not continuously.

[functions."scheduled-spinoff-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-surprise-background above. Kept for reference, the original
  # staggering rationale: Weekly, Saturday 11:02 UTC — originally 11:10,
  # but that collided
  # exactly with scheduled-surprise-background (also Saturday 11:10 UTC,
  # a separate, concurrently-built PR's ~503-call sweep, unaware of this
  # one — see that function's own schedule comment). Moved to 11:02
  # instead: after scheduled-share-count-background (10:50 UTC, finishes
  # ~11:00) and comfortably before scheduled-surprise-background starts at
  # 11:10 — safe because this job only touches ~33 unique tickers (19
  # spincos + 13 unique parent tickers + SPY, ~35 seconds of calls at
  # 1050ms spacing), nowhere near the rate-limit contention risk of this
  # file's full-S&P-500-sweep jobs. Weekly, not daily: this is a fixed,
  # sparse list of ~19 historical events, not a live universe that changes
  # day to day.

[functions."scheduled-margin-leverage-background"]
  # One-time snapshot, no schedule: run manually (Netlify dashboard or a POST
  # to the function). The two-statement sweep (~1006 calls) is too long for
  # one 15-minute run, so each run saves a checkpoint and stops at 12 minutes;
  # run it twice to complete a cycle, and a partial run never replaces a
  # complete published snapshot. Its checkpoint also holds the annual reports
  # scheduled-quality-financials-background.js reads, so run this one first.

[functions."scheduled-roic-wacc-background"]
  # One-time snapshot, no schedule — matches this file's current convention
  # for new full-universe Equities jobs (see scheduled-margin-leverage-
  # background above for the original reasoning: quarterly fundamentals
  # don't move day to day, and new pages since 2026-09-16 read as "the
  # research as it stood on this date"). Run manually (Netlify dashboard
  # "Run now") for a fresh snapshot later; the two-statement sweep
  # (~1006 calls) needs its own checkpoint/resume across runs, same as
  # scheduled-margin-leverage-background's own two-statement sweep — see
  # this function's own file for why it doesn't just read that job's
  # checkpoint instead of paying for a second sweep of the same two
  # endpoints.

[functions."scheduled-cash-conversion-cycle-background"]
  # One-time snapshot, no schedule — same convention as scheduled-roic-
  # wacc-background above. Its own independent ~1006-call INCOME_STATEMENT
  # + BALANCE_SHEET sweep (none of the existing two-statement checkpoints
  # on this site carry inventory/receivables/payables/cost-of-revenue).
  # Optionally reads scheduled-roic-wacc-background's own published
  # snapshot (not its checkpoint) for the CCC-vs-ROIC regression — run
  # that job first if a fresh version of that test is wanted, though this
  # job works fine without it (the test just doesn't render).

[functions."scheduled-analyst-price-target-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-institutional-ownership-background above: matches this
  # site's current convention for new full-universe Equities background
  # jobs. Run manually (Netlify dashboard "Run now") for a fresh
  # snapshot later. ~503 sequential COMPANY_OVERVIEW calls at 1050ms
  # spacing plus a retry pass.

[functions."scheduled-congress-trades-background"]
  # One-time snapshot, no schedule — same convention as the two stanzas
  # above. Re-run manually (Netlify dashboard "Run now") for a fresh pass.
  # Single Alpha Vantage endpoint per company (CONGRESS_TRADES, ~503 calls,
  # 1050ms pacing — same as this file's other single-endpoint full sweeps,
  # e.g. scheduled-insider-transactions-background), plus a read (not a
  # write) of scheduled-relative-strength-background's own latest.json for
  # the page's one regression, so this job has no ordering dependency on
  # that job having run first — it just shows the test as unavailable if
  # that blob hasn't been populated yet.

[functions."scheduled-earnings-call-sentiment-background"]
  # One-time snapshot, no schedule — same convention as
  # scheduled-margin-leverage-background above (see commit 704645f):
  # tonight's new Equities pages read as "the research as it stood on this
  # date," not a continuously-refreshed feed. Re-run manually (Netlify
  # dashboard "Run now") for a fresh pass. Two Alpha Vantage endpoints per
  # company (EARNINGS + EARNINGS_CALL_TRANSCRIPT, ~1,000 calls total,
  # 750ms pacing — see scheduled-earnings-call-sentiment-background.js for
  # why that matches scheduled-margin-leverage-background's pacing rather
  # than this file's usual ~1,050ms single-endpoint sweeps).

[functions."scheduled-institutional-ownership-background"]
  # Weekly, Saturday 11:10 UTC — real recurring schedule (not a one-time
  # snapshot like the 14 functions commit 704645f froze on 2026-09-16; this
  # page's whole point is a multi-week flow trend, so it needs to keep
  # firing). Runs after scheduled-share-count-background (10:50 UTC,
  # finishes ~11:00) so this job's own ~503 sequential
  # INSTITUTIONAL_HOLDINGS calls don't compete with it for the rate limit.
  # 11:10 itself is free as of this writing: it was scheduled-surprise-
  # background's old slot before 704645f removed that job's recurrence —
  # double-checked against every other [functions.*] block in this file
  # before picking it. 13F filings are quarterly with up to a 45-day
  # reporting lag, so a weekly re-sweep is generous, not wasteful — it just
  # means most weeks will show little/no change in any one company's
  # aggregates, which is expected and noted in the page's methodology
  # section, not a bug.
  schedule = "10 11 * * 6"

[functions."scheduled-post-earnings-drift-background"]
  # Weekly, Saturday 11:30 UTC, after institutional-ownership (11:10). Its
  # rolling ~100-trading-day event window needs a fresh price sweep every run,
  # though the earnings-surprise blob it reads is itself a frozen snapshot.
  schedule = "30 11 * * 6"

[functions."scheduled-buyback-effectiveness-background"]
  # One-time snapshot (2026-09-17) — no schedule, matching the convention
  # every page added since 2026-09-16 has settled into (see
  # scheduled-surprise-background's own comment for the original
  # reasoning): this page is meant to read as "the research as it stood on
  # this date," and quarterly cash-flow data doesn't move day to day
  # anyway. Run manually (Netlify dashboard "Run now") if a fresh snapshot
  # is ever wanted later. Depends on scheduled-share-count-background
  # having already run at least once (reads its trends.json for the net
  # share-count side of the dilution-offset comparison) — no scheduling
  # order to manage since neither runs on a recurring cron. ~503
  # sequential CASH_FLOW calls at 1050ms spacing plus a retry pass, plus
  # one FEDERAL_FUNDS_RATE call.

[functions."scheduled-fcf-yield-background"]
  # One-time snapshot (2026-09-17) — no schedule, same reasoning as
  # scheduled-buyback-effectiveness-background above (this file's own
  # convention for every page added since 2026-09-16). Independent of that
  # job — reads only Sector Beeswarm's meta.json, no cross-page blob
  # dependency. ~503 sequential CASH_FLOW calls at 1050ms spacing plus a
  # retry pass.

[functions."scheduled-short-sale-volume-background"]
  # Weekly, Saturday 14:50 UTC. A ~3-month average short-sale-volume ratio
  # doesn't shift day to day.
  schedule = "50 14 * * 6"

[functions."scheduled-news-sentiment-background"]
  # One-time snapshot (2026-09-18) — no schedule, same reasoning as
  # scheduled-surprise-background above (site owner converted most
  # fundamentals-sweep background jobs to manually-triggered one-time
  # snapshots on 2026-09-16 to control Alpha Vantage call volume). Run
  # manually (Netlify dashboard "Run now") if a fresh snapshot is ever
  # wanted later. For the historical record, the staggering this would have
  # used if it were still scheduled: after scheduled-institutional-
  # ownership-background (itself a one-time snapshot as of this same
  # addition — see that function's own comment above — but for the record
  # its ~503-call INSTITUTIONAL_HOLDINGS sweep at 1050ms spacing runs
  # roughly 9 minutes end to end), leaving a few minutes of clearance
  # before this job's own ~503 sequential NEWS_SENTIMENT calls at 1050ms
  # spacing plus a retry pass begin — NEWS_SENTIMENT responses run notably
  # larger than the other endpoints in this Saturday block (up to 50
  # articles per call, each with nested topics/ticker_sentiment arrays), so
  # this job budgets a little extra headroom past the other jobs' own
  # ~9-minute sweeps even though the between-call pacing itself is
  # unchanged. Real dependency, not just pacing: like
  # scheduled-institutional-ownership-background and scheduled-buyback-
  # tracker-background, this job reads scheduled-relative-strength-
  # background's own latest.json for 3-month price performance (the
  # sentiment-vs-forward-return "does media sentiment predict returns" test)
  # instead of running a second price sweep, so it would ideally run after
  # that job too — falls back to sentiment/attention-only rows
  # (relPrice3M: null), not a crash, if that blob isn't populated. Weekly,
  # not daily: this is a rolling latest-~50-articles snapshot, not a
  # slow-moving fundamentals figure, but a daily sweep of ~503 companies'
  # full news feeds would burn Alpha Vantage call volume disproportionately
  # to how much the market-wide signal actually moves day to day.

[functions."scheduled-quality-lowvol-background"]
  # Weekly, Saturday 13:40 UTC, after relative-strength (13:10), whose
  # latest.json it reads for the 3-month performance test. Also requires
  # scheduled-margin-leverage-background's blob to exist, and aborts with an
  # error rather than writing an empty snapshot if it doesn't.
  schedule = "40 13 * * 6"

[functions."scheduled-quality-financials-background"]
  # One-time snapshot, no schedule: run manually after scheduled-margin-
  # leverage-background has finished a cycle. It makes no API calls of its
  # own, only reads that job's checkpoint, so it finishes in seconds.
  # scheduled-quality-score-background depends on the blob it writes.

[functions."scheduled-quality-score-background"]
  # One-time snapshot — no schedule, same convention as scheduled-quality-
  # financials-background above. Run manually via the Netlify dashboard's
  # "Run now" *after* that job has populated its blob at least once — this
  # one reads it directly and fails fast if it hasn't. ~503 sequential
  # CASH_FLOW calls at 1050ms spacing plus a retry pass, same pacing as
  # scheduled-share-count-background's BALANCE_SHEET sweep — see this
  # function's own file for the full Piotroski F-Score methodology.
