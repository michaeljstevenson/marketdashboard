[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/momentum-history"
  to = "/.netlify/functions/momentum-history"
  status = 200

[[redirects]]
  from = "/api/ticker"
  to = "/.netlify/functions/ticker"
  status = 200

[[redirects]]
  from = "/api/volatility"
  to = "/.netlify/functions/volatility"
  status = 200

[[redirects]]
  from = "/api/breadth-internals"
  to = "/.netlify/functions/breadth-internals"
  status = 200

[functions."scheduled-breadth-background"]
  # 20:30 UTC = 4:30pm EDT (summer). Shifts to 3:30pm during EST (winter,
  # roughly Nov-Mar) since Netlify's cron runs in UTC with no DST
  # awareness — adjust to 21:30 for winter-accurate timing if that hour
  # drift matters, though either is safely after the 4:00pm ET close.
  schedule = "30 20 * * 1-5"
