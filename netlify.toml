[functions."scheduled-breadth-background"]
  # 21:30 UTC = 5:30pm EDT (summer) / 4:30pm EST (winter). Netlify's cron
  # runs in UTC with no DST awareness, so 21:30 keeps the whole daily
  # block after the 4:00pm ET close in either regime.
  schedule = "30 21 * * 1-5"

[functions."scheduled-sectors-background"]
  # 5 minutes after scheduled-breadth-background (21:35 vs 21:30 UTC).
  # Yahoo Finance, not Alpha Vantage, so no rate-limit contention with it.
  schedule = "35 21 * * 1-5"

[functions."scheduled-ath-tradingview"]
  # Staggered after the Alpha-Vantage-based jobs above (21:40 UTC) even
  # though this one hits a completely different data source (TradingView,
  # not Alpha Vantage) and only takes a single request — no real
  # contention risk, just keeping all the daily jobs in one predictable
  # block after the close.
  schedule = "40 21 * * 1-5"

[functions."scheduled-ticker-background"]
  # Every 2 minutes during US market hours on weekdays (13:30-20:00 UTC =
  # 9:30am-4:00pm EDT summer; drifts an hour during EST winter, same
  # DST caveat as the jobs above). Unlike those once-daily jobs, the
  # ticker tape is meant to feel current through the trading day. Quotes
  # now come from Yahoo's batched spark endpoint (a run takes seconds);
  # only Fed Funds and WTI still use Alpha Vantage, at most every 30
  # minutes (see scheduled-ticker-background.js). The function's own lock
  # makes an overlapping trigger a no-op.
  schedule = "*/2 13-20 * * 1-5"

[functions."scheduled-factors-background"]
  # Weekly (Saturday 09:00 UTC), not daily like the jobs above — Ken
  # French updates the underlying data roughly monthly, so daily runs
  # would just re-download and re-parse ~180k unchanged data points 6
  # days out of 7 for nothing.
  schedule = "0 9 * * 6"

[functions."scheduled-countries-background"]
  # 21:45 UTC, 5 minutes after scheduled-ath-tradingview. Yahoo Finance,
  # not Alpha Vantage, so no rate-limit contention with the AV-based jobs.
  schedule = "45 21 * * 1-5"

[functions."scheduled-drawdown-background"]
  # 21:30 UTC = 5:30pm EDT / 4:30pm EST, after the close in either regime.
  # Yahoo, not Alpha Vantage, so no rate-limit contention with the block.
  schedule = "30 21 * * 1-5"

[functions."scheduled-seasonality-background"]
  # 21:50 UTC — after the other daily jobs. Not an Alpha Vantage call
  # (Yahoo, not AV), so there's no real rate-limit contention with them;
  # staggered anyway just to keep all the once-daily jobs in one block.
  schedule = "50 21 * * 1-5"

[functions."scheduled-daychange-background"]
  # Hourly at :30 past, 13:30-19:30 UTC (9:30am-3:30pm EDT summer; drifts
  # an hour during EST winter, same DST caveat as the jobs above) —
  # covers the trading session without needing a call right at the open
  # (no prior-close-vs-now gap to measure yet) or close (the once-daily
  # scheduled-breadth-background job already captures that snapshot).
  # Deliberately separate from that job: this one only needs the current
  # price vs. previous close per symbol, fetched from Yahoo's batched
  # spark endpoint (no Alpha Vantage calls), so it's cheap enough to run
  # through the day.
  schedule = "30 13-19 * * 1-5"

[functions."scheduled-putcall-background"]
  # 21:55 UTC — after the other daily jobs. Moved off the live request
  # path (was inside data.js, refetched on every page load) after its
  # ~40 sequential per-date Alpha Vantage calls started pushing that
  # function's runtime past Netlify's timeout; see
  # scheduled-putcall-background.js for the full story.
  schedule = "55 21 * * 1-5"

[functions."scheduled-sentiment-background"]
  # 22:00 UTC — after scheduled-breadth-background (needs its blob) and
  # scheduled-putcall-background (needs its blob) have both finished.
  # Computes the whole U.S. Market Sentiment Index once daily and writes
  # it to Netlify Blobs; data.js just reads that blob now instead of
  # recomputing everything live on every page load — see
  # scheduled-sentiment-background.js for the full story.
  schedule = "0 22 * * 1-5"

[functions."scheduled-oddstats-background"]
  # 22:10 UTC — last of the daily block. Yahoo-only (no Alpha Vantage
  # contention); runs the full streak scanner (~24 sequential Yahoo
  # fetches + ~360 analog scans) and writes the board to Netlify Blobs
  # for oddstats.js to serve. Background function for the long runtime —
  # see scheduled-oddstats-background.js.
  schedule = "10 22 * * 1-5"

[functions."scheduled-beeswarm-daily-background"]
  # 22:40 UTC — after the whole daily Alpha-Vantage block above has
  # cleared (last of it, scheduled-oddstats, is Yahoo but the AV jobs
  # finish well before 21:40), so this job's ~504 GLOBAL_QUOTE calls
  # don't compete for the rate limit. 22:40 UTC = 6:40pm EDT / 5:40pm EST
  # — always after the 4:00pm ET close plus the 15-minute quote delay,
  # in either DST regime. Captures the end-of-day sector-beeswarm
  # snapshot; see scheduled-beeswarm-daily-background.js.
  schedule = "40 22 * * 1-5"

[functions."scheduled-beeswarm-meta-background"]
  # Weekly, Saturday 07:00 UTC — before scheduled-factors-background
  # (09:00 Sat) and well clear of the weekday jobs. ~503 COMPANY_OVERVIEW
  # calls for per-company sector / shares-outstanding metadata that the
  # daily beeswarm job joins against; changes little week to week.
  schedule = "0 7 * * 6"

[functions."scheduled-beeswarm-annual-background"]
  # Weekly, Saturday 08:30 UTC — after the meta job, before the factors
  # job. Only ~12 TIME_SERIES_MONTHLY_ADJUSTED calls (sector ETFs + SPY)
  # to recompute calendar-year returns for the annual historical view;
  # the data only really moves once a year at each year-end close.
  schedule = "30 8 * * 6"

[functions."scheduled-concentration-background"]
  # Weekly, Saturday 09:30 UTC — after the factors job. Only ~8 Alpha
  # Vantage (monthly bars) + ~7 SEC calls for the Magnificent Seven
  # cap-weighted basket vs S&P 500; monthly-granularity data that barely
  # moves week to week, and the SEC share counts update only quarterly.
  schedule = "30 9 * * 6"

[functions."scheduled-concentration-history-background"]
  # Weekly, Saturday 10:00 UTC — after scheduled-concentration-background.
  # ~39 Alpha Vantage monthly-bar calls (SPY + the ever-largest names) for
  # the top-10-share history and annual return-contribution charts;
  # quarterly/annual data that only moves at each quarter-end.
  schedule = "0 10 * * 6"

[functions."scheduled-revisions-background"]
  # Weekly, Saturday 07:20 UTC — 20 minutes after
  # scheduled-beeswarm-meta-background (07:00 UTC), which this job depends
  # on for per-ticker sector/name (see scheduled-revisions-background.js
  # for why it reads that job's blob instead of its own OVERVIEW calls).
  # ~503 sequential EARNINGS_ESTIMATES calls, same ~1.05s pacing as the
  # meta job; trailing-30-day revision counts and 30-day drift don't need
  # daily refresh, so weekly (not one of the weekday daily-close jobs)
  # matches how this site treats other full-index sweeps.
  # Schedule paused for the reworked job's first manual run:
  # schedule = "20 7 * * 6"

[functions."scheduled-smallcap-background"]
  # Weekdays 22:15 UTC, after the close. Four Yahoo price histories, two
  # FRED series and a HEAD check on the Ken French size file (downloaded
  # only when it changes), about 5 seconds. Daily since ETF prices move
  # every trading day.
  # Schedule paused for the reworked job's first manual run:
  # schedule = "15 22 * * 1-5"

[functions."scheduled-international-background"]
  # Daily 22:20 UTC, right after scheduled-smallcap-background (22:15). Index
  # levels move every trading day; about 20 paced Yahoo calls, no contention
  # risk. After scheduled-countries-background (21:45 weekdays) so the country
  # ETFs that job stores are current when this one reads them. Ken French
  # files are re-downloaded at most once a calendar month.
  schedule = "20 22 * * *"

[functions."scheduled-surprise-background"]
  # One-time snapshot (2026-09-16) — no schedule. Earnings Surprise History
  # is meant to read as "the research as it stood on this date," not a
  # continuously-refreshed page, so the recurring schedule below was
  # removed after the initial data pull. Run manually (Netlify dashboard
  # "Run now") if a fresh snapshot is ever wanted later. Kept for
  # reference, the original staggering rationale: Weekly, Saturday 11:10
  # UTC — 40 minutes after
  # scheduled-insider-transactions-background (10:30 Sat) starts, giving its
  # own ~503-call sweep (plus retry pass) room to finish before this one
  # begins. Reads beeswarm-meta's meta.json for sector/name, same reuse
  # pattern as the revisions and insider-transactions jobs. ~503 sequential
  # Alpha Vantage EARNINGS calls at 1050ms spacing plus a retry pass.
  # Weekly, not daily: this rebuilds the whole quarterly panel fresh each
  # run (see scheduled-surprise-background.js for why no accumulating
  # snapshot is needed here), and which companies have newly reported only
  # changes meaningfully week to week, not day to day.

[functions."scheduled-relative-strength-background"]
  # Weekly, Saturday 13:10 UTC. A 1-month to 12-1 month momentum read doesn't
  # change day to day, the top/bottom tenth changes compare against a week
  # earlier, and the momentum study only gains a month-end once a month. Its
  # history through relative-strength-history.js's STATIC_THROUGH is
  # precomputed offline (build_momentum_study.py), later month-ends are
  # computed here. About 1.5 minutes with 4 Yahoo workers.
  schedule = "10 13 * * 6"

[functions."scheduled-equity-risk-premium-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-surprise-background above. Kept for reference, the original
  # staggering rationale: Weekly, Saturday 13:35 UTC — originally 12:30
  # (30 minutes after this
  # PR's own scheduled-relative-strength-background, which it assumed was
  # still at 12:00 and the last job in the Saturday block), but that landed
  # in the middle of scheduled-splits-background's 12:20-~12:31 window (a
  # separate, concurrently-built PR's two-stage sweep, unaware of this one
  # — see that function's own schedule comment) once both were merged.
  # Moved to 13:35 instead: after scheduled-relative-strength-background
  # itself (13:10 UTC, finishes ~13:19, once *its own* collision was fixed
  # — see that function's schedule comment), the last job in the Saturday
  # block as of this fix, leaving headroom even if that job's own retry
  # pass runs long. ~504 sequential Alpha Vantage COMPANY_OVERVIEW/
  # TREASURY_YIELD calls at 1050ms spacing plus a retry pass. Weekly, not
  # daily: a trailing P/E-derived earnings yield doesn't meaningfully move
  # day to day.

[functions."scheduled-earnings-growth-divergence-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-surprise-background above. Kept for reference, the original
  # staggering rationale: Weekly, Saturday 14:00 UTC — originally 13:00
  # (after this PR's own
  # scheduled-relative-strength-background at 12:00 and scheduled-equity-
  # risk-premium-background at 12:30, both since moved — see those
  # functions' own schedule comments for the unrelated collisions that
  # forced the moves). Real dependency, not just pacing: this job reads
  # scheduled-relative-strength-background's own latest.json for 3-month
  # price performance instead of running a second price sweep, so it needs
  # that job to have already completed this same Saturday morning for
  # fresh data (falls back to EPS-growth-only rows, not a crash, if it
  # hasn't) — now scheduled at 13:10, finishing ~13:19. Moved to 14:00 to
  # stay safely after that and after scheduled-equity-risk-premium-
  # background (13:35 UTC, finishes ~13:44), the last two jobs in the
  # Saturday block as of this fix. ~503 sequential Alpha Vantage EARNINGS
  # calls at 1050ms spacing plus a retry pass.

[functions."scheduled-smallcap-liquidity-background"]
  # Weekly, Saturday 14:20 UTC. Reads meta.json (itself refreshed weekly) for
  # cohort membership and recomputes the full ~2-year window each run, so a
  # daily rerun would redo the same sweep for a cohort that barely changes.
  schedule = "20 14 * * 6"

[functions."scheduled-margin-leverage-background"]
  # One-time snapshot, no schedule: run manually (Netlify dashboard or a POST
  # to the function). The two-statement sweep (~1006 calls) is too long for
  # one 15-minute run, so each run saves a checkpoint and stops at 12 minutes;
  # run it twice to complete a cycle, and a partial run never replaces a
  # complete published snapshot. Its checkpoint also holds the annual reports
  # scheduled-quality-financials-background.js reads, so run this one first.

[functions."scheduled-analyst-price-target-background"]
  # One-time snapshot (2026-09-16) — no schedule, same reasoning as
  # scheduled-institutional-ownership-background above: matches this
  # site's current convention for new full-universe Equities background
  # jobs. Run manually (Netlify dashboard "Run now") for a fresh
  # snapshot later. ~503 sequential COMPANY_OVERVIEW calls at 1050ms
  # spacing plus a retry pass.

[functions."scheduled-post-earnings-drift-background"]
  # Weekly, Saturday 11:30 UTC. New reports arrive every week in earnings
  # season, and the latest reports' drift moves with each week's prices.
  # Yahoo and the shared earnings collection, no Alpha Vantage calls.
  schedule = "30 11 * * 6"

[functions."scheduled-short-sale-volume-background"]
  # Weekly, Saturday 14:50 UTC. A ~3-month average short-sale-volume ratio
  # doesn't shift day to day.
  schedule = "50 14 * * 6"

[functions."scheduled-valuations-background"]
  # No schedule until its first run has filled the store.

[functions."scheduled-short-interest-background"]
  # Weekdays 23:10 UTC, after the post-close Yahoo jobs (last at 22:40).
  # FINRA posts each settlement date's file about a week after it, on no
  # fixed day, so a daily check picks it up within a day. Runs with nothing
  # new exit in seconds. Yahoo and stored data only, no Alpha Vantage calls.
  schedule = "10 23 * * 1-5"

[functions."scheduled-quality-financials-background"]
  # One-time snapshot, no schedule: run manually after scheduled-margin-
  # leverage-background has finished a cycle. It makes no API calls of its
  # own, only reads that job's checkpoint, so it finishes in seconds.
  # scheduled-quality-score-background depends on the blob it writes.

[functions."scheduled-quality-score-background"]
  # One-time snapshot — no schedule, same convention as scheduled-quality-
  # financials-background above. Run manually via the Netlify dashboard's
  # "Run now" *after* that job has populated its blob at least once — this
  # one reads it directly and fails fast if it hasn't. ~503 sequential
  # CASH_FLOW calls at 1050ms spacing plus a retry pass, same pacing as
  # scheduled-share-count-background's BALANCE_SHEET sweep — see this
  # function's own file for the full Piotroski F-Score methodology.

[functions."scheduled-putcall-history-background"]
  # Every 15 minutes from 00:00 to 06:45 UTC, the one daily window with no
  # other Alpha Vantage job (weekday jobs run 13:00-22:40 UTC, Saturday's
  # sweeps from 07:00). Each run works for at most 12 minutes at 60 calls a
  # minute and saves its progress, so the ~30,000-call month-end backfill
  # finishes in about two nights. After that, runs only add each new
  # month-end and one current snapshot a week, and otherwise exit at once.
  schedule = "*/15 0-6 * * *"

[functions."scheduled-putcall-study-background"]
  # Daily at 07:20 UTC, right after the put/call backfill window closes
  # (00:00-06:57 UTC), so the page reflects each night's new snapshots.
  # Yahoo and stored data only, no Alpha Vantage calls.
  schedule = "20 7 * * *"

[functions."scheduled-volatility-background"]
  # 21:47 UTC = 5:47pm EDT / 4:47pm EST, after the VIX indices' 4:15pm ET
  # close in either regime. Yahoo only, no Alpha Vantage calls. Between
  # scheduled-countries-background (21:45) and scheduled-seasonality-
  # background (21:50) so its five Yahoo requests don't overlap theirs.
  schedule = "47 21 * * 1-5"

